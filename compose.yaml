# Sobe os 3 serviços: banco (db), API (backend) e site (frontend + Nginx).
# Uso: docker compose up --build   → abra http://localhost
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data   # os dados sobrevivem a reinícios
    ports:
      - "127.0.0.1:5432:5432"             # só acessível da própria máquina (para desenvolvimento)
    healthcheck:                          # o backend só sobe quando o banco aceita conexões
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      # "db" é o nome do serviço acima: dentro do Compose, os serviços se acham pelo nome
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"                           # a única porta aberta para o mundo
    depends_on:
      - backend

volumes:
  dbdata:
