# O Nginx é a porta de entrada (porta 80). Ele decide para onde vai cada requisição:
#   /api/...  → backend FastAPI (o nome "backend" vem do compose.yaml)
#   o resto   → arquivos do React já compilados
server {
    listen 80;

    location /api/ {
        # DNS do Docker. Com o endereço em variável, o Nginx resolve "backend" a cada
        # poucos segundos em vez de só ao iniciar. Sem isso, se o container do backend
        # for recriado (novo IP) numa atualização, o Nginx continua apontando para o IP
        # antigo e responde 502 até alguém reiniciar o frontend. Também deixa o Nginx
        # subir mesmo que o backend ainda não exista.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;   # sem barra/URI no fim: o caminho original é repassado intacto

        proxy_set_header Host $host;
        # As 3 linhas abaixo permitem WebSocket (sem elas, /api/ws não conecta)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Padrão do Nginx é 60 s: uma conexão WebSocket sem tráfego por 1 min seria
        # derrubada (a sala do leilão pode ficar parada esse tempo).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # qualquer rota desconhecida cai no React
    }
}
